[project]
name = "nl2sql-eval-harness"
version = "0.1.0"
description = "NL-to-SQL evaluation harness with a measured LLM judge"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
data = ["huggingface_hub>=0.24", "pyarrow>=16"]
openai = ["openai>=1.40"]
langsmith = ["langsmith>=0.1"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]